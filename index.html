<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCart Discount Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contanier" id="contanier">
    <label for="inp1">Enter the current invoice price:</label>
    <input type="number" id="inp1">
    <label for="inp2">Enter the discount code:</label>
    <input type="text" id="inp2" placeholder="Enter anything">
    <label for="select">Choose your customer type:</label>
    <select id="select">
      <option value="hidden" id="option1"></option>
      <option value="New customer">New customer</option>
      <option value="VIP">VIP Regular Customer</option>
      <option value="normal">Regular customer</option>
    </select>
    <label for="inp3">Enter the shipping cost:</label>
    <input type="number" id="inp3">
    <button id="btn">Approval of the request</button>
    <h4 id="h4"></h4>
    <span id="span1"><h3></h3></span>
  </div>
  <script src="main.js"></script>
</body>
</html>
